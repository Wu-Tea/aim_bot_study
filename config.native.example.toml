# Native runtime normal template. Safety and controller policy remain profile-controlled.
[runtime]
profile = "balanced" # performance | balanced | low_latency | pascal_balanced

[runtime.vision]
capture_width = 640
capture_height = 512
tensor_width = 480 # must match the selected TensorRT engine input
tensor_height = 384
require_isotropic_resize = true # rejects X/Y distortion from mismatched aspect ratios
# The older 480x416 predictive viewport experiment remains opt-in and is not
# compatible with this 480x384 production tensor until its tiers are migrated.
dynamic_viewport_enabled = false
capture_fps = 160
idle_capture_fps = 20
keepwarm_when_idle = true
color_readback_mode = "pageable" # pinned remains opt-in until the A/B gate passes
model_path = "models/best_480x384.engine"
gpu_service_enabled = true

# Historical static alternatives (change all size/path lines together):
# near:     capture 640x440, tensor 512x352, model models/best_512x352.engine
# latency:  capture 630x462, tensor 480x352, model models/best_480x352.engine

[runtime.telemetry]
enabled = false
directory = "runs/native_perf"
manual_controller_hz = 100
queue_capacity = 8192
rotate_size_mb = 256
max_files = 10

[runtime.performance]
# Lightweight whole-runtime statistics; safe to leave on for normal play.
enabled = false
interval_ms = 5000
directory = "runs/perf_summary"
stdout_enabled = true

[runtime.scheduler]
controller_tick_hz = 1000
mode = "legacy" # precision becomes default only after its measured gate passes
spin_tail_us = 50

[runtime.input]
auto_detect = true
controller_index = 0
rb_counts_as_aiming = false

[runtime.output]
enabled = true
validation_mode = "strict"

[gamepad.tracker]
max_observation_age_ms = 50 # reject late detector results before they can steer
# Upright/crouched body-box position measured from top (0=head, 1=feet).
aim_height_ratio = 0.30

[gamepad.aim_response_curve]
# Pluggable inverse curve: linear | cod_dynamic_legacy_lut.
# It reshapes target T before force limiting; it does not blend manual and AI.
algorithm = "cod_dynamic_legacy_lut"
# At this anchor, the nonlinear plugin preserves the locally learned
# px/(stick*s) sensitivity of the previous linear solver.
calibration_reference_stick = 0.50

[gamepad.auto_fire]
fire_output = "RB"
aim_only = true
max_source_age_ms = 50
require_aim_ready = true
manual_takeover_release_seconds = 0.035
manual_takeover_resume_delay_seconds = 0.085
pulse_width_ms = 30
pulse_period_ms = 100

[gamepad.ads]
strength_scale = 1.54
vertical_strength_scale = 1.26
# Spatial ADS admission radius; independent from snap duration.
activation_radius_px = 135
snap_duration_ms = 135
max_acquisition_ms = 220
# Optional ADS output onset shaping. Both default to zero; delay suppresses
# AI output before the boundary, while ramp linearly raises AI authority.
start_delay_ms = 0
start_ramp_ms = 0

[gamepad.bodylock]
strength = 0.45
vertical_strength = 0.50
# Maximum error for timed ADS->BodyLock fallback, not target detection range.
activation_range_px = 80
# Settle radius around the shared tracker target point.
tolerance_px = 8
manual_escape_threshold = 0.45

[gamepad.intent]
helpful_manual_overdrive_enabled = true
helpful_manual_overdrive_max_scale = 1.20
helpful_manual_direction_weight = 0.45

# All documented recoil overrides remain available.
[gamepad.recoil]
enabled = true
selection_log_enabled = false
profile_despike_enabled = true
profile_playback_enabled = false # feedback_amount is the adaptive controller's default baseline
native_recognizer_enabled = false # OCR is intentionally absent from runtime hot path
recognizer_log_enabled = false
recognizer_game = "cod22"
profile_directory = "artifacts/recoil_profiles"
calibration_directory = "artifacts/recoil_calibration"
weapon_directory = "artifacts/recoil_app/weapons"
recognizer_state_path = "artifacts/recoil_app/current_weapon.json"
recognizer_fps = 5
profile_amount = 1.0
profile_x_amount = 1.0
feedback_amount = 0.20
adaptive_feedback_enabled = true # fresh single-target residual adjusts the fixed fallback
adaptive_min_amount = 0.06
adaptive_max_amount = 0.42
firing_vertical_intent_enabled = true # changes target-relative D; never raw manual + AI
firing_vertical_intent_max_offset_px = 48.0
firing_vertical_intent_deadzone = 0.025
profile_lead_ms = 0.0
profile_velocity_reference_ms = 10.0
profile_despike_threshold_px = 2.0
profile_despike_ratio = 3.0
piecewise_mid_pixels_y = 45.0
piecewise_max_pixels_y = 180.0
piecewise_mid_ratio_y = 0.65
