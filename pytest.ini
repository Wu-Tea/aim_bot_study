[pytest]
addopts = --import-mode=importlib
pythonpath = python
# Default: current configuration, desktop process control, launch and C++ bridges.
# Optional tools/features: pytest python/tests python/tools/tests
# Native controller contracts remain in CTest, not Python gameplay copies.
testpaths =
    python/tests/test_config_loader.py
    python/tests/test_main_cli.py
    python/tests/test_desktop_app.py
    python/tests/test_desktop_profiles_curves.py
    python/tests/test_startup_scripts.py
    python/tests/test_repository_layout.py
    python/tests/test_native_vision_targeting_bridge.py
    python/tests/test_native_vision_image_ops_bridge.py
norecursedirs = .git .pytest_cache .venv .worktrees artifacts native/build* native/vision_native/build*
