<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>手柄助手 · 工作区视觉稿</title>
<style>

*{box-sizing:border-box}body{margin:0;background:#101216;color:var(--ink);font:13px 'Microsoft YaHei UI','Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer;color:var(--ink);border:0;background:var(--input);padding:8px 14px;border-radius:5px}button:hover{background:#353d49}button:focus-visible,input:focus-visible,svg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.primary{background:var(--ink);color:#171a20;font-weight:600}button.quiet{background:transparent;color:var(--muted)}.app{height:calc(100vh - 38px);min-height:620px;background:var(--bg);display:flex;flex-direction:column;padding:16px 24px 0;max-width:1400px;margin:auto}.top{display:flex;align-items:center;gap:12px;height:36px;flex-shrink:0}.brand{font-size:15px;font-weight:600;letter-spacing:1px}.status{color:var(--muted);margin-left:auto;font-size:12px}.profiles{display:flex;gap:8px;margin:16px 0 12px;align-items:center;flex-shrink:0}.profile-list{display:flex;gap:8px;flex:1;overflow:auto;scrollbar-width:thin}.profile{background:transparent;border:1px solid transparent;text-align:left;width:156px;flex-shrink:0;height:58px;padding:9px 12px}.profile.active{background:var(--selected);border-color:var(--accent)}.profile span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.profiles .tools{display:flex;gap:4px}.nav{display:flex;border-bottom:1px solid var(--line);align-items:center;margin-bottom:18px;gap:6px;height:40px;flex-shrink:0}.nav button{background:transparent;color:var(--muted);border-radius:0;height:40px;padding:0 16px}.nav button.active{color:var(--ink);border-bottom:2px solid var(--accent)}.nav .extra{margin-left:auto;border:0;font-size:12px}.workspace{overflow:auto;flex:1;padding:0 2px 12px;scrollbar-width:thin}.columns{display:grid;grid-template-columns:1fr 1fr;gap:30px}.group{margin-bottom:20px}h2{font-size:14px;font-weight:600;margin:0 0 10px;padding:0 0 8px;border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:minmax(112px,1fr) minmax(126px,1.4fr) 24px;gap:8px;min-height:38px;align-items:center}.row label{color:#d3d9e1;font-size:12px}.control{display:flex;align-items:center;gap:10px;min-width:0}.control input[type=number]{width:64px;text-align:right;height:28px;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 7px;appearance:textfield}.control input[type=number]::-webkit-inner-spin-button{appearance:none}.control input[type=range]{width:100%;min-width:40px;accent-color:var(--accent);height:4px}.row input[type=checkbox]{appearance:none;width:30px;height:18px;border-radius:9px;background:#424b58;position:relative;margin:0 0 0 auto;cursor:pointer}.row input[type=checkbox]:before{content:'';position:absolute;width:12px;height:12px;background:#d7deea;border-radius:50%;top:3px;left:3px}.row input[type=checkbox]:checked{background:#527aa6}.row input[type=checkbox]:checked:before{left:15px}.select{width:100%;height:28px;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:4px 9px;border:1px solid var(--line);font-size:12px}.more{background:transparent;padding:2px;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.8}.value{font-variant-numeric:tabular-nums;color:var(--ink);text-align:right}.summary .row{grid-template-columns:1fr 1fr;min-height:34px}.path{background:var(--input);border:1px solid var(--line);color:var(--ink);padding:7px 9px;flex:1;min-width:0;border-radius:4px;width:100%}.inline{display:flex;gap:8px;align-items:center;margin-bottom:12px}.curve{width:100%;height:300px;background:#1b1f26;border:1px solid var(--line);border-radius:6px;touch-action:none}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}.toolbar .select{max-width:230px}.toolbar .spacer{flex:1}.toolbar button{font-size:12px}.footer{min-height:48px;border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;color:var(--muted);font-size:12px;flex-shrink:0}.footer #notice{margin-left:auto;text-align:right}.demo{height:38px;display:flex;gap:16px;align-items:center;justify-content:center;background:#101216;color:var(--muted);font-size:11px}.demo button{padding:4px 8px;font-size:11px}.popup{position:fixed;min-width:210px;max-height:360px;overflow:auto;background:var(--panel);padding:5px;border:1px solid #4a5462;border-radius:7px;box-shadow:0 10px 32px #0008;z-index:5}.popup button{width:100%;background:transparent;text-align:left;display:flex;gap:10px;min-height:32px;font-size:12px}.popup button:hover,.popup button:focus{background:#35445c;outline:0}.popup .check{width:16px;color:var(--accent)}.refs{position:fixed;inset:0;background:#171a20;z-index:8;overflow:auto;padding:32px;display:none}.refs header{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:auto}.refs article{max-width:1200px;margin:30px auto}.ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}.refs img{width:100%;max-height:330px;object-fit:contain;background:#101216}.refs h3{font-size:16px}.refs p{color:var(--muted);line-height:1.8}.refs a{color:var(--accent)}.tokens{display:flex;gap:20px;margin:16px 0}.swatch{display:flex;gap:8px;align-items:center;font-size:12px}.swatch i{width:24px;height:24px;border:1px solid var(--line);border-radius:4px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{padding:11px;text-align:right;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}th{color:var(--muted);font-weight:400}details summary{cursor:pointer;color:var(--muted);padding:8px 0;font-size:12px}details[open] summary{margin-bottom:10px}@media(max-width:850px){.app{padding:14px 18px 0}.columns{gap:20px}.row{grid-template-columns:118px minmax(100px,1fr) 18px;gap:5px}.nav button{padding:0 12px}.profile{width:144px}.ref-grid{grid-template-columns:1fr}.brand{font-size:14px}.top{gap:8px}.top button{padding:8px 11px}}@media(prefers-reduced-motion:no-preference){button,input{transition:backgr </style><style>
.search{margin-left:auto;width:178px;height:28px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:4px 8px;font-size:12px}.search[hidden]{display:none}.profile.dirty:after{content:'●';color:var(--accent);font-size:8px;position:absolute;right:8px;top:9px}.profile{position:relative}.control{justify-content:flex-end}.control input[type=range]{flex:1}.unit{color:var(--muted);font-size:11px;width:18px}.field-error{grid-column:1/-1;color:#e6bd83;font-size:11px}.field-error:empty{display:none}.invalid{border-color:#e6bd83!important}.more{opacity:0}.row:hover .more,.row:focus-within .more{opacity:1}.model-file{padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:left;font-size:12px}.advanced{margin:0 0 16px}.advanced summary{border-top:1px solid var(--line);padding-top:12px}.point-toolbar{display:flex;gap:16px;align-items:center;margin:14px 0 8px;font-size:12px}.point-toolbar input{width:65px;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px;text-align:right}.spacer{flex:1}.inline-error{color:#e6bd83;font-size:12px}.inline-error:empty{display:none}dialog{width:440px;max-width:calc(100vw - 32px);background:var(--panel);color:var(--ink);border:1px solid #495362;border-radius:8px;padding:24px;overflow:visible}dialog::backdrop{background:#0008}dialog .path{margin:10px 0 16px}dialog .select{margin:8px 0 14px}dialog label{display:block}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.dialog-error{color:#e6bd83;font-size:12px}.nav{gap:0}.nav button{padding:0 13px}.curve{height:320px}.top .status{max-width:300px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
</style>
<div class="app">
<header class="top"><div class="brand">手柄助手</div><div class="status">● 已停止</div><button class="quiet" id="stop" disabled>停止</button><button id="save">保存修改</button><button class="primary" id="start">启动配置</button></header>
<div class="profiles"><div class="profile-list" id="profiles"></div><div class="tools"><button id="new">＋ 新建</button><button id="profile-more" class="quiet" aria-label="配置操作">⋯</button></div></div>
<nav class="nav" id="nav"></nav><main class="workspace" id="workspace"></main>
<footer class="footer"><span id="changes">所有修改已保存</span><span id="notice">Apex · 日常</span></footer>
</div>
<div class="demo">视觉与交互稿 · 演示数据，不启动程序或保存个人配置 <button id="references">参考图谱 / 设计语言</button></div>
<style>
.curve{height:clamp(190px,calc(100vh - 430px),300px)}
.local-tabs{display:flex;gap:4px;margin:0 0 12px}.local-tabs button{font-size:12px;padding:5px 10px;background:transparent;color:var(--muted)}.local-tabs button[aria-pressed=true]{background:var(--input);color:var(--ink)}
.point-toolbar{gap:10px;flex-wrap:wrap}.point-toolbar input,.point-row input{font-variant-numeric:tabular-nums}.point-row{display:grid;grid-template-columns:64px 1fr 1fr;align-items:center;gap:10px;min-height:38px}.point-row input{width:85px;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 6px;text-align:right}.point-row .inline-error{grid-column:2/-1}.point-row .inline-error:empty{display:none}.precision-table{margin:12px 0}.precision-table summary,.learning-details summary,.perf-history summary{border-top:1px solid var(--line);padding:12px 0}
.calibration .toolbar .select{width:135px}.stages{display:flex;list-style:none;gap:16px;padding:0;margin:8px 0 16px;color:var(--muted);font-size:12px}.stages .current{color:var(--ink)}.stages .complete{color:var(--accent)}.demo-source{font-size:11px;color:var(--muted);margin:6px 0 10px}.calibration-graph{width:100%;height:clamp(155px,calc(100vh - 520px),210px);background:#1b1f26;border:1px solid var(--line);border-radius:5px}.graph-legend{display:flex;gap:20px;font-size:11px;margin:8px 0;color:var(--muted)}.graph-legend span:before{content:'';display:inline-block;width:16px;height:2px;margin:0 6px 3px 0;background:#929caa}.graph-legend .legend-raw:before{background:#e6bd83}.graph-legend .legend-fit:before{background:var(--accent)}.cal-result{display:flex;gap:28px;margin:12px 0;font-size:12px;color:var(--muted)}.cal-result strong{color:var(--ink);margin-left:8px;font-weight:400}.cal-actions{position:sticky;bottom:0;background:var(--bg);padding:10px 0;margin-bottom:0;border-top:1px solid var(--line)}
.performance .toolbar h2{margin:0;padding:0;border:0}.performance-heading{display:flex;align-items:center;gap:40px;margin:18px 0 8px}.perf-value{font-size:36px;font-variant-numeric:tabular-nums;line-height:1.5}.perf-value small{font-size:13px;color:var(--muted)}.performance-heading dl{display:flex;flex:1;justify-content:space-between;gap:14px;margin:0}.performance-heading dt{font-size:11px;color:var(--muted);margin-bottom:8px}.performance-heading dd{margin:0;font-size:14px;font-variant-numeric:tabular-nums}.performance-graph{width:100%;height:clamp(130px,calc(100vh - 510px),200px);background:#1b1f26;border:1px solid var(--line);border-radius:5px}.performance .toolbar{margin-top:10px}.learning-details{margin-top:8px}
@media(max-width:850px){.point-toolbar{gap:8px;font-size:11px}.point-toolbar button{padding:5px 7px;font-size:11px}.stages{gap:10px;font-size:11px}.performance-heading{gap:22px}.performance-heading dl{gap:10px}.cal-result{gap:16px}}
.calibration h2{display:none}.calibration > .note{margin:6px 0}.calibration .demo-source{margin:4px 0 6px}.calibration-graph{height:clamp(105px,calc(100vh - 600px),150px)}.calibration .stages{margin:4px 0 10px;font-size:11px}.calibration .graph-legend{margin:6px 0}.calibration .cal-result{margin:8px 0}.point-row input::-webkit-inner-spin-button{appearance:none}
</style>
