function render(){document.querySelector('.sources').innerHTML=DATA.sources.map((s,i)=>brand!=='all'&&s.brand!==brand?'':`<button data-index="${i}" class="${current===i?'active':''}">${s.brand} · ${esc(s.product)}<small>${esc(s.screen)}</small></button>`).join('');const s=DATA.sources[current],img=s.images[imageIndex];document.querySelector('main').innerHTML=`<div class="heading"><div><h2>${esc(s.product)} · ${esc(s.screen)}</h2><div class="evidence">${esc(s.evidence)}</div></div><a href="${s.source}" target="_blank" rel="noopener">官方说明 ↗</a>${s.image_source?`<a href="${s.image_source}" target="_blank" rel="noopener">Sony 发布图片 ↗</a>`:""}</div><div class="gallery">${img?`<img src="${img.url}" alt="${esc(s.product)} 官方界面参考 ${imageIndex+1}">`:'<p class="note-empty">本来源提供操作说明，未提供可用界面截图。<br>布局结论不可仅由此页面推断。</p>'}</div><div id="error"></div><div class="thumbs">${s.images.map((_,i)=>`<button data-image="${i}" class="${i===imageIndex?'active':''}">图 ${i+1}</button>`).join('')}</div><div class="notes">${s.notes?Object.entries(s.notes).map(([k,v])=>`<div><h3>${esc(k)}</h3><p>${esc(v)}</p></div>`).join(''):'<p class="note-empty">参考说明见设计推导文件；图片本身不证明完整交互行为。</p>'}</div>`;document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.index);imageIndex=0;render()});document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{imageIndex=Number(b.dataset.image);render()});const image=document.querySelector('.gallery img');if(image)image.onerror=()=>document.querySelector('#error').textContent='官方图片加载失败，请使用来源链接核对。'}document.querySelectorAll('[data-brand]').forEach(b=>b.onclick=()=>{brand=b.dataset.brand;current=DATA.sources.findIndex(s=>brand==='all'||s.brand===brand);imageIndex=0;render()});render();</script></html>
