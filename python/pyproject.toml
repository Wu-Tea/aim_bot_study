[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-study-tools"
version = "0.1.0"
description = "Python fallback, desktop assistant, training and diagnostics for the native runtime"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = ["main", "controller", "project_paths"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "controllers*", "desktop_app*", "recoil_app*", "runtime*", "training*", "vision*", "tools*"]
exclude = ["tools.tests*", "*.__pycache__*"]
