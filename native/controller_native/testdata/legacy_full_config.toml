[runtime.vision]
capture_width = 640
capture_height = 512
capture_fps = 140
model_path = "models/candidates/body_union_manual_core_x2_neg_e6_640x512.engine"
fallback_model_path = "models/best.pt"
quit_key = "0"
native_cue_sidecar = false
perf_log = true
aim_perf_file_log = true
aim_perf_log_dir = "runs/native_perf"
aim_perf_log_interval_ticks = 1
gpu_service_enabled = true
gpu_service_active_fps = 120
gpu_service_idle_fps = 20
gpu_service_keepwarm_when_idle = true
gpu_service_repeat_last_on_no_update = true
fusion_enabled = false
fusion_session = "dev"
fusion_show_all_detections = false

[runtime.gamepad]
auto_fire_output = "RB"
rb_counts_as_aiming = false
xinput_auto_detect = true
xinput_user_index = 0
tracker_backend = "fps_reference"

[gamepad.auto_fire]
aim_only = true
max_source_age_ms = 50.0
require_aim_ready = true
manual_takeover_release_seconds = 0.035
manual_takeover_resume_delay_seconds = 0.085

[gamepad.ai_aim]
smoothing = 0.62
max_pixels = 130
max_ai_force = 0.64
max_ai_force_y = 0.80
ai_delta_gain = 1.0
piecewise_mid_pixels = 60
piecewise_max_pixels = 230
piecewise_mid_ratio = 0.56
piecewise_mid_pixels_y = 45
piecewise_max_pixels_y = 180
piecewise_mid_ratio_y = 0.65
deadzone_inner = 1.5
deadzone_outer = 5
x_deadzone_outer = 3
target_max_age_ms = 96
target_projection_max_age_ms = 96
target_projection_reticle_speed_px_per_sec = 1500
target_projection_velocity_lowpass_alpha = 0.35
target_projection_max_velocity_px_per_sec = 1200
target_projection_weak_velocity_decay = 0.70
ads_snap_window_ms = 100
ads_snap_smoothing = 0.0
ads_snap_max_ai_force = 1.0
ads_snap_max_ai_force_y = 1.0
ads_snap_fov_scale = 1.0
ads_snap_fov_transition_ms = 0.0
ads_snap_max_target_dy_px = 90
ads_snap_reticle_speed_px_per_sec = 1500
ads_snap_time_to_go_gain = 1.0
ads_snap_time_to_go_min_remaining_ms = 35
ads_snap_opposing_manual_suppression_max = 0.35
auto_fire_ready_error_px = 16
auto_fire_ready_frames = 2
auto_fire_ready_min_ads_ms = 70
auto_fire_ready_max_ai_stick = 6000
weak_target_body_lock_force_scale = 0.55
cue_hold_body_lock_force_scale = 0.35
body_lock_smoothing = 0.14
body_lock_max_ai_force = 0.30
body_lock_opposing_boost_max_ai_force = 0.42
body_lock_max_ai_force_y = 0.42
body_lock_box_tolerance_px = 18
body_lock_activation_box_px = 150
body_lock_confidence_frames = 5
body_lock_confidence_min_strong = 0.50
body_lock_opposing_suppression_max = 1.0
body_lock_orthogonal_suppression_max = 0.60
body_lock_helpful_preservation_floor = 1.0
body_lock_manual_overlap_scale = 0.0
body_lock_manual_escape_input_threshold = 0.45
body_lock_manual_escape_preservation = 0.55
body_lock_near_lock_error_px = 32
body_lock_vertical_orthogonal_bias = 1.15
body_lock_vertical_deadzone_px = 6
body_lock_vertical_tail_inner_px = 2
body_lock_vertical_tail_speed_threshold_px_per_sec = 90
body_lock_release_tail_scale = 0.20
body_lock_lateral_motion_min_speed_px_per_sec = 120
body_lock_lateral_motion_lead_seconds = 0.04
body_lock_lateral_motion_lead_window_px = 8
body_lock_lateral_motion_lead_max_px = 7
body_lock_lateral_motion_tail_scale = 0.65
body_lock_lead_frames = 5
body_lock_lead_seconds = 0.026
body_lock_vertical_lead_scale = 0.95
body_lock_lead_max_px = 18
body_lock_target_match_iou = 0.10
