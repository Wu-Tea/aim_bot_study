[gamepad.aim_assist_dynamics]
enabled = true
recoil_jitter_guard_enabled = true
recoil_jitter_assist_threshold = 1400
recoil_jitter_flip_scale = 0.20
recoil_jitter_memory_seconds = 0.050
manual_curve_straighten_enabled = true
